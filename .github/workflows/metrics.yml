name: Metrics
on:
  push:
    branches: ["main", "master"]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - name: Generate Metrics
        uses: lowlighter/metrics@latest
        with:
          # ⚠️ FIX PRINCIPAL : un token personnel est obligatoire pour que
          # metrics puisse lister TES dépôts. ${{ github.token }} identifie
          # le bot "github-actions" et non 50bvd, donc l'action retombait
          # uniquement sur les données du dépôt courant (50bvd/50bvd).
          token: ${{ secrets.METRICS_TOKEN }}

          # Options générales
          user: 50bvd
          template: classic
          base: header, activity, community, repositories, metadata
          base_indepth: yes

          # Configuration
          config_timezone: Europe/Paris
          config_display: large
          config_output: default
          output_action: commit
          committer_message: "chore: update metrics"

          # 🈷️ Langages - Indepth pour tous les repos
          plugin_languages: yes
          plugin_languages_limit: 15
          plugin_languages_colors: github
          plugin_languages_threshold: 0%
          plugin_languages_details: bytes-size, percentage, lines
          plugin_languages_indepth: yes
          plugin_languages_ignored: tex
          plugin_languages_other: no

          # 📦 Repositories - Afficher vos repos avec leurs langages
          plugin_repositories: yes
          plugin_repositories_order: starred

          # 📅 Calendrier isométrique
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # 👨‍💻 Lignes de code - réactivé : l'erreur précédente venait du
          # même token invalide, plugin_lines a besoin d'un vrai PAT
          plugin_lines: yes

          # 🌟 Repos starrés
          plugin_stars: yes
          plugin_stars_limit: 3

          # 📌 Topics
          plugin_topics: yes
          plugin_topics_limit: 15
          plugin_topics_mode: icons
          plugin_topics_sort: stars

          # 🏆 Achievements - nouveau : badges débloqués (polyglot,
          # stargazer, developer, etc.)
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_display: compact

          # 🎖️ Notable contributions - nouveau : tes contributions
          # marquantes, y compris sur tes propres repos
          plugin_notable: yes
          plugin_notable_repositories: yes
