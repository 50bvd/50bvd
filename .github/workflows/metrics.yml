name: Metrics
on:
  # Exécuter à chaque push sur la branche main
  push:
    branches: ["main", "master"]
  # Exécuter quotidiennement à 2h du matin
  schedule:
    - cron: "0 2 * * *"
  # Permettre l'exécution manuelle
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Metrics
        uses: lowlighter/metrics@latest
        with:
          # Token GitHub avec permissions nécessaires
          token: ${{ secrets.METRICS_TOKEN }}
          
          # Options générales
          user: 50bvd
          template: classic
          base: header, activity, community, repositories, metadata
          
          # EXCLUSION TOTALE du repo privé
          repositories_skipped: 50bvd/clipboardfilter
          
          # Configuration d'affichage
          config_timezone: Europe/Paris
          config_display: large
          config_output: default
          output_action: commit
          committer_message: "chore: update metrics"
          
          # Plugins activés
          
          # 🈷️ Langages utilisés (REPOS PUBLICS UNIQUEMENT)
          plugin_languages: yes
          plugin_languages_skipped: 50bvd/clipboardfilter
          plugin_languages_analysis_timeout: 60
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 12
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%
          plugin_languages_details: bytes-size, percentage
          plugin_languages_ignored: html, css, tex, c++, cpp, c
          
          # 📅 Calendrier isométrique des commits
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          
          # 👨‍💻 Lignes de code modifiées
          plugin_lines: yes
          plugin_lines_skipped: 50bvd/clipboardfilter
          plugin_lines_history_limit: 3
          plugin_lines_repositories_limit: 10
          plugin_lines_sections: base, repositories
          
          # 🌟 Repos récemment starrés
          plugin_stars: yes
          plugin_stars_limit: 3
          
          # 📌 Topics favoris
          plugin_topics: yes
          plugin_topics_limit: 15
          plugin_topics_mode: icons
          plugin_topics_sort: stars
