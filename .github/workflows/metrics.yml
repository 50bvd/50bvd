name: Metrics
on:
  # Exécuter à chaque push sur la branche main
  push:
    branches: ["main", "master"]
  # Exécuter quotidiennement à 2h du matin
  schedule:
    - cron: "0 2 * * *"
  # Permettre l'exécution manuelle
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Metrics
        uses: lowlighter/metrics@latest
        with:
          # Token GitHub avec permissions nécessaires
          token: ${{ secrets.METRICS_TOKEN }}
          
          # Options générales
          user: 50bvd
          template: classic
          base: header, activity, community, repositories, metadata
          repositories_forks: no
          repositories_affiliations: owner
          repositories_skipped: |
          
          # Configuration d'affichage
          config_timezone: Europe/Paris
          config_display: large
          config_output: default
          output_action: commit
          committer_message: "chore: update metrics"
          
          # Plugins activés
          
          # 🈷️ Langages utilisés (analyse des repos)
          plugin_languages: yes
          plugin_languages_analysis_timeout: 30
          plugin_languages_categories: markup, programming, data
          plugin_languages_colors: github
          plugin_languages_limit: 12
          plugin_languages_recent_categories: markup, programming, data
          plugin_languages_recent_days: 365
          plugin_languages_recent_load: 1000
          plugin_languages_sections: most-used, recently-used
          plugin_languages_threshold: 0%
          plugin_languages_indepth: yes
          plugin_languages_details: percentage, bytes-size
          plugin_languages_ignored: html, css, tex
          
          # 📅 Calendrier isométrique des commits
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          
          # 💡 Habitudes de code
          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_habits_days: 30
          plugin_habits_facts: yes
          plugin_habits_from: 500
          plugin_habits_trim: yes
          
          # 🎫 Gists publics
          plugin_gists: yes
          
          # 📰 Activité récente
          plugin_activity: yes
          plugin_activity_days: 30
          plugin_activity_filter: all
          plugin_activity_limit: 5
          plugin_activity_load: 1000
          plugin_activity_timestamps: yes
          plugin_activity_visibility: public
          
          # 👨‍💻 Lignes de code modifiées
          plugin_lines: yes
          plugin_lines_history_limit: 3
          plugin_lines_repositories_limit: 10
          plugin_lines_sections: base, repositories
          
          # 🏆 Achievements (badges GitHub)
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: C
          
          # 🎩 Contributions notables
          plugin_notable: yes
          plugin_notable_from: all
          plugin_notable_repositories: yes
          plugin_notable_indepth: yes
          
          # 🌟 Repos récemment starrés
          plugin_stars: yes
          plugin_stars_limit: 3
          
          # 📌 Topics favoris
          plugin_topics: yes
          plugin_topics_limit: 15
          plugin_topics_mode: icons
          plugin_topics_sort: stars
